<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUSOHAYAKAIRYOU</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
}

body{
  background:#51b9e3;
  color:#fff;
  font-family:system-ui,sans-serif;
}

nav{
  width:min(100%,414px);
  margin:auto;
  padding:42px 42px 18px;
}

a{
  color:inherit;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
}

svg{
  width:42px;
  height:42px;
  display:block;
  flex:none;
}

span{
  font-size:17px;
  line-height:1;
}

#time{
  margin-top:20px;
  font-size:14px;
}
</style>
</head>

<body>

<nav aria-label="リンク">

<a href="https://x.com/KAMI5056DAYO"
   target="_blank"
   rel="noopener noreferrer">

<svg viewBox="0 0 42 42" aria-label="X" role="img">
<rect width="42" height="42" rx="3" fill="#000"/>
<path d="M10 9h6.7l5.2 7.1L28 9h4L24 19l8 14h-6.7l-5.7-8-6.1 8H9.5l8.1-10.1z"
      fill="#fff"/>
</svg>

<span>X</span>

</a>

<div id="time">計測中...</div>

</nav>

<script>
window.addEventListener("load", function () {
    const nav = performance.getEntriesByType("navigation")[0];

    document.getElementById("time").textContent =
        "navigationStart → responseEnd: " +
        (nav.responseEnd - nav.startTime).toFixed(2) +
        " ms";

    console.log(nav);
});
</script>

</body>
</html>
